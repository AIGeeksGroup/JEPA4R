# Sec. 5.6 in the RM75-B digital twin: twin check against the vendor URDF, the twin-trained world model and decoder on
# the twin's Cube, and the world models and policy heads trained in the twin with its two hands (below). Real-arm runs
# are not included. A policy head and the decoded look-ahead preview on the twin's Cube have no implementation in the
# four source branches (their twin Cube only plans with CEM, Tab. S1) and no number in the paper, so no job runs them
# (docs/reproduce.md, Open Items).
name: twin
expected: [paper/expected/twin.yaml]   # no table: the paper reports no twin numbers (Sec. 5.6 "Results" is qualitative)

jobs:
  - stage: verify_twin
    grid: {env: [rm75b_cube]}
  - stage: collect_wm_data
    grid: {env: [rm75b_cube]}
  - stage: train_wm
    grid: {env: [rm75b_cube], method: [jepa4r]}
  - stage: train_decoder
    grid: {env: [rm75b_cube], decoder: [page4d]}
  # the RH56 dexterous hand on the twin (configs/env/rm75b_rh56_relocate.yaml): the OGBench-cube branch's RH56 Relocate,
  # JEPA4R and LeWM, BC seeds 100 / 200 / 300 (no number in the paper)
  - stage: collect_wm_data
    grid: {env: [rm75b_rh56_relocate]}
  - stage: prepare_policy_data
    grid: {env: [rm75b_rh56_relocate]}
  - stage: train_wm
    grid: {env: [rm75b_rh56_relocate], method: [jepa4r, lewm]}
  - stage: train_policy
    grid: {env: [rm75b_rh56_relocate], method: [jepa4r, lewm]}
  # the EG2-4C2 gripper on the twin, four CortexBench MetaWorld tasks (configs/env/rm75b_mw_*.yaml): the cortexbench
  # branch's RM75 runs (scripts/run_mw_pipeline.sh with TASK=mw_<task>_rm75: LeWM 2D and JEPA4R world models, 10 epochs;
  # CortexBench BC seeds 100 / 200 / 300 on the twin's own demos), Random (ViT-B) on bin-picking and button-press as
  # there (logs/cortexbench/runs/rand_vitb/rm75-*); no number in the paper
  - stage: collect_wm_data
    grid: {env: &rm75_mw [rm75b_mw_bin_pick, rm75b_mw_button, rm75b_mw_drawer, rm75b_mw_assembly]}
  - stage: prepare_policy_data
    grid: {env: *rm75_mw}
  - stage: train_wm
    grid: {env: *rm75_mw, method: [jepa4r, lewm]}
  - stage: train_policy
    grid: {env: *rm75_mw, method: [jepa4r, lewm]}
  - stage: train_policy
    grid: {env: [rm75b_mw_bin_pick, rm75b_mw_button], method: [random_vitb]}
