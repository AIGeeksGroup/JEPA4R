# mw_button_pcd.yaml (the collection's point cloud with the box, the training affine) on the RM75-B + EG2-4C2: same
# protocol, RM75 env and dataset; set_state restores the RM75 controller's state and the box (mw_button_rm75_pix.yaml).
defaults:
  - mw_button_pcd
  - _self_

world:
  env_name: envs.metaworld:swm/MWButtonPressRM75-v0

dataset:
  stats: metaworld/mw_button_rm75_pcd   # the training set's normalisation statistics

eval:
  dataset_name: metaworld/mw_button_rm75_test_pcd
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
        ee_target:
          value: ee_target
        q_cmd:
          value: q_cmd
        box_pos:
          value: box_pos
    - method: set_goal_state
      args:
        hand_pos:
          value: goal_hand_pos
        obj_pos:
          value: goal_obj_pos

output:
  filename: mw_button_rm75_pcd_results.txt
