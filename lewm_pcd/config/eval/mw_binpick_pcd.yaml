# mw_binpick_pix.yaml for the 3D model: the same camera's point cloud (MWPointCloudWrapper with the collection's
# settings, scripts/data/config/mw_binpick.yaml) and the training affine (config/train/data/mw_binpick_pcd.yaml;
# eval.py checks it against the checkpoint).
defaults:
  - mw_binpick_pix
  - _self_

world:
  pre_wrappers:
    - _target_: envs.metaworld.MWPointCloudWrapper
      num_points: 1200
      voxel_size: 0.005
      cube_fraction: 0.25

obs: pcd
pcd_process:
  center: [0.0, 0.65, 0.2]
  scale: 4.0
  use_rgb: true

eval:
  dataset_name: metaworld/mw_binpick_test_pcd

output:
  filename: mw_binpick_pcd_results.txt
