# LeWM paper protocol on CortexBench's TriFinger move_cube env (envs/trifinger: its own MoveCubeEnv), 2D, as
# config/eval/mw_binpick_pix.yaml with the steps counted in model steps: MetaWorld's model step is 5 rows (frameskip
# 5), the goal 25 rows = 5 model steps ahead, a budget of 10 model steps and plans of 5 blocks of 5 rows; TriFinger
# trains with frameskip 1 (a row is 0.4 s), so the goal is 5 rows ahead, the budget 10 rows, plans 5 blocks of 1 row.
# CEM 300 samples / top 30 / 10 iterations, start = a row of the held-out test set (150 move episodes, world seed
# 2000000; an episode has 11 rows, so starts are rows 0-5).
# Success = every fingertip within 4 cm AND the cube within 3 cm of the goal row's (TriFingerEnv.set_goal_state;
# MetaWorld: hand 4 cm, object 3 cm). The env's episode limit is raised to 40 steps (eval.py runs up to 20).
# Runs in the lewm_tf python (scripts/run_tf_pipeline.sh).
defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: envs.trifinger:swm/TriFinger-v0   # gymnasium imports envs.trifinger (registers the id) first
  num_envs: ${eval.num_eval}
  max_episode_steps: ???   # eval.py sets 2 x eval_budget
  task: move
  max_steps: 40

dataset:
  stats: trifinger/tf_cube   # normalisation statistics: the model's training set
  keys_to_cache:
    - action

seed: 42
policy: random
device: cuda
video: false

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 1

eval:
  num_eval: 50
  goal_offset_steps: 5
  eval_budget: 10
  img_size: 224
  dataset_name: trifinger/tf_cube_test
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
        ft_des:
          value: ft_des
    - method: set_goal_state
      args:
        ft_pos:
          value: goal_ft_pos
        obj_pos:
          value: goal_obj_pos

output:
  filename: tf_cube_pix_results.txt

solver:
  n_steps: 10
