defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/OGBCubePCD-v0     # OGBCube-v0 + the 4 extra cameras; identical dynamics
  # must match scripts/data/config/ogb_pcd.yaml (the collection settings)
  pre_wrappers:
    - _target_: envs.PointCloudWrapper
      num_points: 1200
      cameras: [front_pixels, pcd_front_left, pcd_back_left, pcd_back_right, pcd_front_right, pcd_top]
      foreground_only: true
      crop_box: [[0.10, -0.50, -0.02], [0.75, 0.50, 0.60]]
      voxel_size: 0.005
      cube_fraction: 0.25
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget
  env_type: single
  ob_type: states
  multiview: False
  width: 224
  height: 224
  visualize_info: False
  terminate_at_goal: True

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action

seed: 42
policy: random # ckpt name or random

obs: pcd                 # model consumes point clouds (see eval.py / envs/eval_policy.py)
device: cuda             # cpu = keep the GPU untouched while trainings run (auto_eval_checkpoints.sh sets it with solver.device)
pcd_process:             # must match config/train/data/ogb_pcd.yaml preprocessor
  center: [0.425, 0.0, 0.2]
  scale: 4.0
  use_rgb: true
video: false             # the panel video needs dataset pixels, which the point-cloud dataset does not store

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: ogbench/cube_single_expert_pcd
  callables:
    # -- set state
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    # -- set target pos
    - method: set_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: False
        target_pos:
          value: goal_privileged_block_0_pos
        target_quat:
          value: goal_privileged_block_0_quat

output:
  filename: ogb_cube_pcd_results.txt

# 论文附录 D：cube 的 CEM 迭代 10 次（发布的 solver/cem.yaml 写的是 30，是 PushT 的值）。这里覆盖，官方文件不动。
solver:
  n_steps: 10
