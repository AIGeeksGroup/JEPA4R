# Pixel baseline evaluation = the official cube.yaml unchanged, plus the two knobs the auto-eval loop passes
# (device, video) which the released config does not define.
defaults:
  - cube
  - _self_

device: cuda
video: false

# 论文附录 D：cube 的 CEM 迭代 10 次（发布的 solver/cem.yaml 写的是 30，是 PushT 的值）。这里覆盖，官方文件不动。
solver:
  n_steps: 10

output:
  filename: ogb_cube_pix_results.txt
