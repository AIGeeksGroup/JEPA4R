# Evaluation of the aggregated world model: identical protocol to cube_pcd.yaml except
#   * the model gets the last 3 observed frames (history_len 3, frames action_block=5 steps apart, as in training)
#   * the goal is the 3 frames leading up to the goal frame (goal-10, goal-5, goal) so the aggregator can form latent2
defaults:
  - cube_pcd
  - _self_

plan_config:
  history_len: 3

eval:
  goal_window: 3      # frames ending at the goal frame, action_block steps apart

output:
  filename: ogb_cube_pcd_agg_results.txt
