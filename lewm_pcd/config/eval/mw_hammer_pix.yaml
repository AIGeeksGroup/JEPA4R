# mw_binpick_pix.yaml (LeWM paper protocol, 2D) on MetaWorld hammer: start = a row of the held-out test set, goal = the
# row 25 steps later; success = hand within 4 cm AND the hammer within 3 cm of the goal row's. The hammer and the nail
# are joints, so set_state restores them with qpos (the nail box never moves).
defaults:
  - mw_binpick_pix
  - _self_

world:
  env_name: envs.metaworld:swm/MWHammer-v0

dataset:
  stats: metaworld/mw_hammer   # the training set's normalisation statistics

eval:
  dataset_name: metaworld/mw_hammer_test

output:
  filename: mw_hammer_pix_results.txt
