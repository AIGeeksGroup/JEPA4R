# 4D 像素模型的评测：协议与 cube_pix.yaml（= 官方 cube.yaml）完全相同，只多两点，和 cube_pcd_agg.yaml 对 cube_pcd.yaml 的关系一样：
#   * 模型拿到最近 3 帧观测（history_len 3，间隔 action_block=5 步，与训练一致；起点前的帧从数据集填充）
#   * 目标是目标帧及其前 5、10 步共 3 帧（goal-10, goal-5, goal），供聚合器形成 latent2
defaults:
  - cube_pix
  - _self_

plan_config:
  history_len: 3

eval:
  goal_window: 3

output:
  filename: ogb_cube_pix_agg_results.txt
