# LeWM paper protocol on MetaWorld bin-picking, 2D (pixels): start = a row of the held-out test set, goal = the row
# 25 steps later in the same episode, 50-step budget, CEM 300 samples / top 30 / 10 iterations (as the cube configs).
# Success = hand within 4 cm AND cube within 3 cm of the goal row's (MWBinPickEnv.set_goal_state).
defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: envs.metaworld:swm/MWBinPick-v0   # gymnasium imports envs.metaworld (registers the id) first
  num_envs: ${eval.num_eval}
  max_episode_steps: ???   # eval.py sets 2 x eval_budget

dataset:
  stats: metaworld/mw_binpick   # normalisation statistics: the model's training set (eval.dataset_name: the test set)
  keys_to_cache:
    - action

seed: 42
policy: random
device: cuda
video: false

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: metaworld/mw_binpick_test
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
        mocap_pos:
          value: mocap_pos
        mocap_quat:
          value: mocap_quat
    - method: set_goal_state
      args:
        hand_pos:
          value: goal_hand_pos
        obj_pos:
          value: goal_obj_pos

output:
  filename: mw_binpick_pix_results.txt

solver:
  n_steps: 10
