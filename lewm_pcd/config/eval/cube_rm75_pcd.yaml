# cube_pcd.yaml (3D point cloud, paper protocol) on the RM75-B + EG2-4C2: same protocol, RM-75 env, dataset and crop box.
defaults:
  - cube_pcd
  - _self_

world:
  env_name: swm/OGBCubeRM75PCD-v0
  pre_wrappers:   # = cube_pcd.yaml with the RM-75 crop box (x_min 0.21, past the RM-75 base); must match scripts/data/config/ogb_rm75_pcd.yaml
    - _target_: envs.PointCloudWrapper
      num_points: 1200
      cameras: [front_pixels, pcd_front_left, pcd_back_left, pcd_back_right, pcd_front_right, pcd_top]
      foreground_only: true
      crop_box: [[0.21, -0.50, -0.02], [0.75, 0.50, 0.60]]
      voxel_size: 0.005
      cube_fraction: 0.25

eval:
  dataset_name: ogbench/cube_rm75_single_expert_pcd

output:
  filename: ogb_cube_rm75_pcd_results.txt
