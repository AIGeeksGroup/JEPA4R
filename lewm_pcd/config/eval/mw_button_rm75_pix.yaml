# mw_button_pix.yaml (LeWM paper protocol, 2D) on the RM75-B + EG2-4C2: same protocol, RM75 env and dataset; set_state
# restores the RM75 controller's state (hand target, joint commands) instead of the Sawyer's mocap, and the box.
defaults:
  - mw_button_pix
  - _self_

world:
  env_name: envs.metaworld:swm/MWButtonPressRM75-v0

eval:
  dataset_name: metaworld/mw_button_rm75_test
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
        ee_target:
          value: ee_target
        q_cmd:
          value: q_cmd
        box_pos:
          value: box_pos
    - method: set_goal_state
      args:
        hand_pos:
          value: goal_hand_pos
        obj_pos:
          value: goal_obj_pos

output:
  filename: mw_button_rm75_pix_results.txt
