# 3D reconstruction from a frozen world model: the per-frame latent1 -> point cloud, with the PAGE-4D-initialised decoder.
# Two stages (scripts/recon/run_page4d.sh runs both, then the evaluation and the videos):
#   python train_recon.py ckpt=<run>/weights_epoch_N.pt data.input=<dataset>.h5 exp=frozen subdir=<A> output_model_name=<A>
#   python train_recon.py ckpt=<run>/weights_epoch_N.pt data.input=<dataset>.h5 exp=lora decoder.init_from=recon/<A>/weights_epoch_1.pt subdir=<B> output_model_name=<B>
# Any 2D / 3D / 4D checkpoint works: only jepa.JEPA.encode is used, and only the decoder is trained.
defaults:
  - _self_
  - launcher: local
  - data: ogb_pcd
  - decoder: page4d
  - exp: frozen                 # frozen (stage A) | lora (stage B)

ckpt: ???                       # relative to $STABLEWM_HOME/checkpoints, e.g. cube_rm75_pcd_dexart/weights_epoch_10.pt
output_model_name: recon        # saved under $STABLEWM_HOME/checkpoints/recon/<output_model_name>/
subdir: ${hydra:job.id}

# what the encoder reads. null = as the checkpoint was trained (observation columns and preprocessor of its run's config.yaml)
input_keys: null
input_preprocessor: null

num_workers: 6
train_split: 0.9
seed: 3072
embed_dim: 192
num_points: 1200                # points per target cloud

trainer:                        # per stage: batch 32 x 14140 steps = a quarter of an epoch of ~1.8M training frames
  max_epochs: 1
  limit_train_batches: 14140
  limit_val_batches: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 32                # frames
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:                      # the learning rate of each group is set in optim_groups (exp/*.yaml)
  type: AdamW
  lr: 3e-4
  weight_decay: 1e-4
  betas: [0.9, 0.95]
