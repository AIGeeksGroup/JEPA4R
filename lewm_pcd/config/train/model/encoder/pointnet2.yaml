# encoder 4: PointNet++ single-scale-grouping classifier (charlesq34/pointnet2 pointnet2_cls_ssg); the MLP widths x 2.5
# of the original ([64,64,128], [128,128,256], [256,512,1024]) match ViT-tiny's 5.50M parameters (5.51M)
