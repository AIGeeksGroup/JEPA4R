# encoder 3: PPRL PointPatchTransformer (conf/model/ppt.yaml defaults); embed_dim 402 instead of 384
# matches ViT-tiny's 5.50M parameters (5.45M); random FPS start in train mode only
_target_: encoders.PointPatchTransformer
in_dim: ${pcd_in_dim}
embed_dim: 402
depth: 3
num_heads: 6
mlp_ratio: 3
group_size: 32
sampling_ratio: 0.0625
random_start: true
out_dim: ${embed_dim}
