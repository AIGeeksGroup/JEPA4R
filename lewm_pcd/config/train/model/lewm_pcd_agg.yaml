defaults:
  - encoder: ms2
  - _self_

# aggregated world model (work item 3): encoder -> latent1 -> aggregator(3 frames) -> latent2 -> predictor(+action) -> next latent1
_target_: jepa_agg.AggJEPA

obs_key: pcd
window: ${history_size}          # frames aggregated into latent2
cost_space: latent2              # planning cost in latent2 space (goal = frames leading up to the goal frame); or latent1

# encoder from config/train/model/encoder/*.yaml:  model=lewm_pcd_agg model/encoder=ms2|dexart|ppt

# temporal aggregator: ARPredictor's temporal structure (positional embedding + causal blocks) without actions
aggregator:
  _target_: aggregators.TemporalTransformerAggregator
  dim: ${embed_dim}
  max_frames: ${history_size}
  depth: 2
  heads: 16
  dim_head: 64
  mlp_dim: 2048
  dropout: 0.1
  emb_dropout: 0.0

predictor:
  _target_: module.ARPredictor
  num_frames: 1               # single token: latent2 (+ action via AdaLN), see jepa_agg.AggJEPA.predict
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

action_encoder:
  _target_: module.Embedder
  input_dim: ???
  emb_dim: ${embed_dim}

projector:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true

pred_proj:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true
