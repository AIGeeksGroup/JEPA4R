# ogb_pcd.yaml (point cloud, frameskip 5) on the MetaWorld bin-picking three-part dataset (same rollouts as
# mw_binpick.yaml, row for row). Fixed affine centred between the two bins; must match config/eval/mw_binpick_pcd.yaml.
defaults:
  - ogb_pcd
  - _self_

dataset:
  name: metaworld/mw_binpick_pcd.h5

preprocessor:
  center: [0.0, 0.65, 0.2]   # m: the bins are at y ~0.7, x -0.17..0.17; table top z 0
  scale: 4.0
