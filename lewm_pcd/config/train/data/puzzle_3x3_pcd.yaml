# ogb_pcd.yaml (point cloud, frameskip 5) on the same puzzle-3x3 rollouts as puzzle_3x3.yaml, row for row (the single
# front_pixels depth camera). puzzle shares OGBench cube's ManipSpace workspace, so ogb_pcd.yaml's affine stays
# ([0.425, 0, 0.2], 4.0)
defaults:
  - ogb_pcd
  - _self_

dataset:
  name: ogbench/puzzle_3x3_noisy1000_pcd.h5
