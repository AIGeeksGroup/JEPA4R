dataset:
  name: ${oc.env:UR5E_TRAIN_DATA}
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 5
  keys_to_load:
    - pcd_xyz
    - pcd_rgb
    - action
    - observation
  keys_to_cache:
    - action
    - observation

# Loaded as a separate dataset. This prevents episode leakage from the random
# clip split used by legacy configs.
validation_name: ${oc.env:UR5E_HOLDOUT_DATA}

preprocessor:
  _target_: utils.get_pcd_preprocessor
  source_xyz: pcd_xyz
  source_rgb: pcd_rgb
  target: pcd
  center: [0.425, 0.0, 0.2]
  scale: 4.0
  use_rgb: true
