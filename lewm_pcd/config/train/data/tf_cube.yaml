# dmc.yaml (pixels / action / observation) on the TriFinger three-part dataset (scripts/data/collect_tf.py: move_cube
# and reach_cube episodes in CortexBench's own envs). frameskip 1: a row is one env step of 0.4 s, already the span of
# a MetaWorld model step (frameskip 5)
defaults:
  - dmc
  - _self_

dataset:
  name: trifinger/tf_cube.h5
  frameskip: 1
