# dmc.yaml (pixels / action / observation, frameskip 5) on the OGBench scene world-model dataset: the four object tasks
# (cube, button, drawer, window) collected with MetaWorld's three-part plan (envs/ogb_scene_env.py,
# scripts/data/run_scene_collection.sh: front_pixels 224x224, opaque arm), the full 4 x 2500 episodes (2 M rows), one
# model for the whole scene. The small run of results_ogbench.md: scene_small.yaml
defaults:
  - dmc
  - _self_

dataset:
  name: ogbench/scene_wm10000.h5
