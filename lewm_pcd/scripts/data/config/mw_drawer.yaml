# MetaWorld drawer-open, three-part plan, paired 2D + 3D (scripts/data/collect_mw.py): mw_binpick.yaml with the drawer-open
# env, the drawer case (a fixture the reset re-places; the drawer is its child) in the point-cloud foreground and the
# drawer backbone.
defaults:
  - mw_binpick
  - _self_

env_id: swm/MWDrawer-v0
dataset_name: metaworld/mw_drawer_pcd.h5

pcd:
  fixtures: [drawer]

policy:
  _target_: envs.metaworld.DrawerThreePartPolicy
