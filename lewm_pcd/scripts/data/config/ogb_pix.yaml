# Mirrors stable-worldmodel scripts/data/config/ogb.yaml (10 envs x 200 steps, 10000 episodes, seed 3072);
# output name = the paper's dataset name so config/train/data/ogb.yaml and config/eval/cube.yaml need no overrides.
defaults:
  - _self_
  - launcher/local

hydra:
  output_subdir: null
  mode: RUN
  run:
    dir: ${oc.env:STABLEWM_HOME,../lewm_pcd_data}/logs/collect/${now:%Y-%m-%d}/${now:%H-%M-%S}

cache_dir: null
dataset_name: ogbench/cube_single_expert.h5

world:
  num_envs: 10
  max_episode_steps: 200
  image_shape: [224, 224]

num_workers: 4
seed: 3072
world_seed: null   # direct World seed; the sharded launcher sets one per shard
num_traj: 10000

options: null
