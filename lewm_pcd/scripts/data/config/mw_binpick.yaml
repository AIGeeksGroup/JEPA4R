# MetaWorld bin-picking, three-part plan, paired 2D + 3D (scripts/data/collect_mw.py). Full scale = the cube's
# collection (ogb_pcd.yaml): 10 envs x 200 steps, 10000 episodes, seed 3072. Plan, policy and point-cloud settings
# are those of the sampling check (envs/metaworld).
defaults:
  - _self_
  - launcher/local

hydra:
  output_subdir: null
  mode: RUN
  run:
    dir: ${oc.env:STABLEWM_HOME}/logs/collect/${now:%Y-%m-%d}/${now:%H-%M-%S}

cache_dir: null
env_id: swm/MWBinPick-v0
dataset_name: metaworld/mw_binpick_pcd.h5   # 3D: point cloud + states / actions
pix_dataset_name: null                      # 2D: pixels + the same rows; null = dataset_name without '_pcd'

world:
  num_envs: 10
  max_episode_steps: 200
  image_shape: [224, 224]

env:                                        # MWBinPickEnv's collection plan
  episode_len: ${world.max_episode_steps}
  mix: [0.5, 0.3, 0.2]                      # shares of backbone / branch / random episodes

pcd:                                        # one depth camera (top_cap2), as the 2D data
  _target_: envs.metaworld.MWPointCloudWrapper
  num_points: 1200
  voxel_size: 0.005      # m; de-duplicate before sampling
  cube_fraction: 0.25    # guaranteed share of points on the cube

policy:                                     # backbone / branch / random
  _target_: envs.metaworld.ThreePartPolicy

seed: 3072
world_seed: null   # direct World seed; the sharded launcher sets one per shard
num_traj: 10000
