# OGBench scene (envs/ogb_scene_env.py: OGBench's own scene-v0), one object task per run with MetaWorld's three-part
# plan, paired 2D + 3D (scripts/data/collect_ogb.py). scripts/data/run_scene_collection.sh runs the four tasks in shards
# (task k at seed_base (k + 1) x 10^6) and merges them into one dataset (ogbench/scene_wm10000{,_pcd}.h5).
defaults:
  - _self_
  - launcher/local

hydra:
  output_subdir: null
  mode: RUN
  run:
    dir: ${oc.env:STABLEWM_HOME,../lewm_pcd_data}/logs/collect/${now:%Y-%m-%d}/${now:%H-%M-%S}

cache_dir: null
env_id: swm/OGBenchScene-v0
dataset_name: ogbench/scene_wm10000_pcd.h5   # 3D: point cloud + states / actions (the run script names one per shard)
pix_dataset_name: null                       # 2D: pixels + the same rows; null = dataset_name without '_pcd'

world:
  num_envs: 1             # OGBench's oracles draw from numpy's global RNG: one env per process
  max_episode_steps: 200  # MetaWorld's episode length
  image_shape: [224, 224]

env:
  task: cube              # cube | button | drawer | window

pcd:                      # one depth camera (front_pixels), as the 2D data
  _target_: envs.ogb_pcd.ScenePointCloudWrapper

policy:
  _target_: envs.ogb_scene_env.SceneThreePartPolicy

episodes: 2500            # of this task, over all shards (the full scale: 4 x 2500 = 10000 episodes, 2 M rows)
seed_base: 1000000        # episode i at seed seed_base + i
shard: 0
num_shards: 1
health_check: true        # OGBench's scene check: an episode whose cube left the view is collected again at seed + 10^7 k
