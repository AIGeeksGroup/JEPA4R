# MetaWorld assembly, three-part plan, paired 2D + 3D (scripts/data/collect_mw.py): mw_binpick.yaml with the assembly
# env, the peg in the point-cloud foreground (a fixture the reset re-places) and the assembly backbone.
defaults:
  - mw_binpick
  - _self_

env_id: swm/MWAssembly-v0
dataset_name: metaworld/mw_assembly_pcd.h5

pcd:
  fixtures: [peg]

policy:
  _target_: envs.metaworld.AssemblyThreePartPolicy
