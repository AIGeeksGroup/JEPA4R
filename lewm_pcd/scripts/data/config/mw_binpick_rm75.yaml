# mw_binpick.yaml (full scale, three-part plan, paired 2D + 3D) on the RM75-B + EG2-4C2 instead of the Sawyer
# (envs/metaworld/rm75): same collection settings, RM75 env, its collection policy and dataset names.
defaults:
