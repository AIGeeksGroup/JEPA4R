# Mirrors stable-worldmodel scripts/data/config/ogb.yaml (10 envs x 200 steps,
# 10000 episodes, seed 3072) plus the point-cloud block. One run writes the 3D
# dataset (dataset_name) and the 2D dataset (pix_dataset_name) of the same rollouts.
defaults:
  - _self_
  - launcher/local

hydra:
  output_subdir: null
  mode: RUN
  run:
    dir: ${oc.env:STABLEWM_HOME,/root/autodl-tmp/lewm234d/lewm_pcd_data}/logs/collect/${now:%Y-%m-%d}/${now:%H-%M-%S}

cache_dir: null
dataset_name: ogbench/cube_single_expert_pcd.h5       # 3D: point cloud + states / actions
pix_dataset_name: ogbench/cube_single_expert.h5       # 2D: pixels + the same states / actions, row for row

world:
  num_envs: 10
  max_episode_steps: 200
  image_shape: [224, 224]

pcd:
  num_points: 1200
  # exactly one depth camera (eye-to-hand, ToF-style; no multi-camera fusion): front_pixels, the 2D dataset's camera
  cameras: [front_pixels]
  foreground_only: true
  crop_box: [[0.10, -0.50, -0.02], [0.75, 0.50, 0.60]]   # world frame, drops the base column / shoulder
  voxel_size: 0.005      # m; de-duplicate before sampling (0 = off)
  cube_fraction: 0.25    # guaranteed share of points on the cube (fewer only if fewer are visible)
  keep_rgb: false   # true only for pilots / visualisation: also stores the camera's RGB and pose in the 3D dataset

num_workers: 4
seed: 3072
world_seed: null   # direct World seed; the sharded launcher sets one per shard
num_traj: 10000

options: null
