version: 1
license_note: "Use is subject to each upstream model's license; do not redistribute weights in Git."
models:
  vc1_vitb:
    family: VC-1
    architecture: ViT-B/16
    upstream_url: https://dl.fbaipublicfiles.com/eai-vc/vc1_vitb.pth
    local_path: ${STABLEWM_HOME}/checkpoints/cortexbench_baselines/vc1_vitb.pth
    loader: baselines.load_vc1
    transform: eai-vc.vc_models.transforms.vit_transforms
  vc1_vitl:
    family: VC-1
    architecture: ViT-L/16
    upstream_url: https://dl.fbaipublicfiles.com/eai-vc/vc1_vitl.pth
    local_path: ${STABLEWM_HOME}/checkpoints/cortexbench_baselines/vc1_vitl.pth
    loader: baselines.load_vc1
    transform: eai-vc.vc_models.transforms.vit_transforms
  r3m_rn50:
    family: R3M
    architecture: ResNet-50
    upstream_url: https://pytorch.s3.amazonaws.com/models/rl/r3m/r3m_50.pt
    local_path: ${STABLEWM_HOME}/checkpoints/cortexbench_baselines/r3m_50.pt
    loader: baselines.load_resnet_baseline; URL used by the official R3M/TorchRL loader
    transform: ImageNet Resize(256)+CenterCrop(224)
  rand_vitb:
    family: control
    architecture: random frozen ViT-B/16
    upstream_url: null
    local_path: null
    loader: vc_models official random-init config
    transform: eai-vc.vc_models.transforms.vit_transforms
