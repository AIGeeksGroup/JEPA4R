# LeWM 3D (DexArt PointNet + projector) on the same scene episodes' point clouds (config/train/data/scene_pcd.yaml; run
# scene_pcd_dexart, epoch 10). Input (N, 6) point clouds; center / scale / use_rgb = the training preprocessing (checked
# against the checkpoint's config.yaml)
_target_: lewm_cortex.load_lewm_pcd
checkpoint_dir: ${oc.env:STABLEWM_HOME}/checkpoints/scene_pcd_dexart
epoch: 10
center: [0.425, 0.0, 0.2]
scale: 4.0
use_rgb: true
