_base_: _metaworld
name: mw_hammer
display: Hammer
env_id: hammer-v2-goal-observable   # CortexBench task id (demos, evaluation)
pointcloud:
  keep_extra: []   # fixtures welded to the world but re-placed at reset
wm_data:
  env_id: swm/MWHammer-v0   # collection env (metaworld 3.0 hammer-v3-goal-observable)
  pcd:
    fixtures: []
    multisample: false   # point clouds of the paper data: single-sample render (collected after the other tasks)
  policy: {_target_: jepa4r.envs.metaworld.HammerThreePartPolicy}
  sets:
    - {name: mw_hammer, num_episodes: 10000, shards: 40}
    - {name: mw_hammer_test, num_episodes: 150, world_seed: 2000000}
  files: {pointcloud: mw_hammer_pcd.h5, image: mw_hammer.h5}
  split: random_clips
