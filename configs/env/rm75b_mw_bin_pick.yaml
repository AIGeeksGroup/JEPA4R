# MetaWorld bin-picking on the RM75-B digital twin (Sec. 5.6 "Robot Setup": the twin carries either end effector, and
# for each one JEPA4R's world model and policy heads are trained only on twin data, with the same recipe as in
# simulation). The cortexbench branch runs CortexBench's bin-picking with the RealMan RM75-B + Inspire EG2-4C2 in place
# of the Sawyer (lewm_pcd/envs/metaworld/rm75, bench/cortexbench/run_bc_rm75.py, results_metaworld.md): task, camera,
# collection plan, point clouds and imitation protocol are mw_bin_pick's; robot, collection env, CortexBench env and
# demos are the twin's. The paper reports no number for it. Values from cortexbench@9331494:lewm_pcd/<path>:<line>.
_base_: mw_bin_pick
suite: metaworld_rm75         # bench/cortexbench/grid.py:46-50 (suite metaworld_rm75: run_bc_rm75.py, its own demos)
name: rm75b_mw_bin_pick
display: Bin-pick (RM75-B twin)
env_id: rm75-bin-picking-v2-goal-observable   # CortexBench task id (demos, evaluation): bench/cortexbench/grid.py:46-48,
                              # run_bc_rm75.py:42-43 (TASKS)
robot:
  name: rm75b
  model: realman_rm75b/rm75b.xml   # jepa4r/envs/twins/descriptions/: envs/metaworld/rm75/scene.py:29 (ARM_XML)
  end_effector: eg2_4c2       # paper: Inspire EG2-4C2 gripper; envs/metaworld/rm75/scene.py:30 (GRIPPER_XML)
wm_data:
  env_id: swm/MWBinPickRM75-v0   # scripts/data/config/mw_binpick_rm75.yaml:7; envs/metaworld/__init__.py:30-34
  pcd:
    multisample: false        # single-sample render (envs/metaworld/pcd.py since cortexbench 6a498d9, 2026-09-29): the
                              # twin's data were collected on 2026-09-30 (logs/collect_mw_binpick_rm75.log of the data home)
  policy: {_target_: jepa4r.envs.twins.metaworld_rm75.RM75BinPickThreePartPolicy}   # scripts/data/config/mw_binpick_rm75.yaml:10-11 (its collection policy made for the RM75)
  sets:                       # scripts/data/run_mw_collection.sh:17-18 (CFG=NAME=mw_binpick_rm75: 10,000 episodes in 40
                              # shards, test 150 at world seed 2,000,000; logs/collect_mw_binpick_rm75.log)
    - {name: mw_binpick_rm75, num_episodes: 10000, shards: 40}
    - {name: mw_binpick_rm75_test, num_episodes: 150, world_seed: 2000000}
  files: {pointcloud: mw_binpick_rm75_pcd.h5, image: mw_binpick_rm75.h5}   # config/train/data/mw_binpick_rm75{,_pcd}.yaml
policy_data:
  source: demos               # bench/cortexbench/make_rm75_demos.py: 25 demos of metaworld's scripted expert on the twin
  demos_per_task: 25          # make_rm75_demos.py:28 (N = 25)
