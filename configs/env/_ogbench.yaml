# OGBench manipulation [park2025ogbench]: Cube (1-4 cubes), Scene, Puzzle.
_base_: _base
suite: ogbench
impl: jepa4r.envs.ogbench
camera:
  name: front_pixels          # the camera behind OGBench's pixel observations
                              # cortexbench:lewm_pcd/envs/pcd_wrapper.py:41 (DEFAULT_CAMERAS), ogb_scene_env.py:60, ogb_puzzle_env.py:49
pointcloud:
  sampler: {name: stratified, object_fraction: 0.25}   # cortexbench:lewm_pcd/envs/pcd_wrapper.py:191-219 (_sample);
                                                       # scripts/data/config/ogb_pcd.yaml:30 (cube_fraction: 0.25)
  affine: {center: [0.425, 0.0, 0.2], scale: 4.0}      # cortexbench:lewm_pcd/config/train/data/ogb_pcd.yaml:19-20;
                                                       # model input (xyz - center) * scale ++ rgb / 255 (utils.py:62-88)
eval:                         # supp. sec:supp-policy: 50 episodes on each of the five official tasks
  num_tasks: 5
  episodes_per_task: 50
