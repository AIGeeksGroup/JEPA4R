# OGBench Cube-Triple, run by the Cube workflow (jepa4r/policy/gciql). Fixed in that workflow for this env, not set
# here: native evaluation horizon 1000 steps; reset seed 970000000 + 100000 * task + episode; official play data
# 3,000 / 300 train / validation episodes; GCIQL current input latent + 19 state entries, goal latent + 9.
_base_: _ogbench
name: cube_triple
display: Cube-Triple
env_id: cube-triple-play-v0   # OGBench task of the native evaluation
camera:
  name: front_pixels          # the render camera of every Cube (224 x 224, RGB AA4, geometry AA0); here OGBench's
                              # front camera turned 5 degrees up about its local x axis
pointcloud:
  crop_box: [[-0.25, -0.50, -0.02], [0.75, 0.50, 0.90]]
policy: gciql
wm_data:                      # supp. sec:supp-data
  num_episodes: 10000
  episode_len: 1000
  mixture: {expert_low_noise: 0.2, expert_high_noise: 0.4, expert_then_random: 0.2, random: 0.2}
                              # of each task's 2,000 train episodes 400 / 800 / 200 + 200 / 400; expert-then-random
                              # has two variants, 0.1 each
  collector: cube_workflow    # the workflow's collect + views stages (jepa4r/data/cube)
  env_id: swm/OGBCubeOfficialFixedTriple-v0   # OGBench's fixed-task Cube-Triple env
  seed: 0                     # collection seed, fixed by the workflow; world seed base 3000000, policy seed base
                              # 103000000
  sets:                       # 5 tasks x 5 strategies, train then validation
    - {name: train, num_episodes: 10000}
    - {name: validation, num_episodes: 1000}
  split: episodes             # independent validation episodes
policy_data:
  source: official_play       # OGBench's official play data (supp. sec:supp-policy)
  dataset: cube-triple-play-v0 # + its -val split (URLs and sizes: configs/env/cube/official_sources.json)
workflow:                     # jepa4r.policy.gciql.cube_stage (the workflow's run config)
  workers: 2                  # the workflow's default
  prefetch: 2                 # the workflow's default
