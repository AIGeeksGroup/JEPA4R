_base_: _metaworld
name: mw_drawer
display: Drawer
env_id: drawer-open-v2-goal-observable   # CortexBench task id (demos, evaluation)
pointcloud:
  keep_extra: ['drawer']   # fixtures welded to the world but re-placed at reset
wm_data:
  env_id: swm/MWDrawer-v0   # collection env (metaworld 3.0 drawer-open-v3-goal-observable)
  pcd:
    fixtures: ['drawer']
    multisample: true   # point clouds of the paper data: multisampled render (jepa4r/envs/metaworld/pcd.py)
  policy: {_target_: jepa4r.envs.metaworld.DrawerThreePartPolicy}
  sets:
    - {name: mw_drawer, num_episodes: 10000, shards: 40}
    - {name: mw_drawer_test, num_episodes: 150, world_seed: 2000000}
  files: {pointcloud: mw_drawer_pcd.h5, image: mw_drawer.h5}
  split: random_clips
