_base_: _metaworld
name: mw_button
display: Button
env_id: button-press-topdown-v2-goal-observable   # CortexBench task id (demos, evaluation)
pointcloud:
  keep_extra: ['box']   # fixtures welded to the world but re-placed at reset
wm_data:
  env_id: swm/MWButtonPress-v0   # collection env (metaworld 3.0 button-press-topdown-v3-goal-observable)
  pcd:
    fixtures: ['box']
    multisample: true   # point clouds of the paper data: multisampled render (jepa4r/envs/metaworld/pcd.py)
  policy: {_target_: jepa4r.envs.metaworld.ButtonThreePartPolicy}
  sets:
    - {name: mw_button, num_episodes: 10000, shards: 40}
    - {name: mw_button_test, num_episodes: 150, world_seed: 2000000}
  files: {pointcloud: mw_button_pcd.h5, image: mw_button.h5}
  split: random_clips
