_base_: _metaworld
name: mw_bin_pick
display: Bin-pick
env_id: bin-picking-v2-goal-observable   # CortexBench task id (demos, evaluation)
pointcloud:
  keep_extra: []   # fixtures welded to the world but re-placed at reset
wm_data:
  env_id: swm/MWBinPick-v0   # collection env (metaworld 3.0 bin-picking-v3-goal-observable)
  pcd:
    fixtures: []
    multisample: true   # point clouds of the paper data: multisampled render (jepa4r/envs/metaworld/pcd.py)
  policy: {_target_: jepa4r.envs.metaworld.ThreePartPolicy}
  sets:
    - {name: mw_binpick, num_episodes: 10000, shards: 40}
    - {name: mw_binpick_test, num_episodes: 150, world_seed: 2000000}
  files: {pointcloud: mw_binpick_pcd.h5, image: mw_binpick.h5}
  split: random_clips
