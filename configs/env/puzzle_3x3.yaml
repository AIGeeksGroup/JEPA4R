_base_: _ogbench
name: puzzle_3x3
display: Puzzle 3x3
env_id: puzzle-3x3-v0         # OGBench board: cortexbench:lewm_pcd/envs/ogb_puzzle_env.py:48, 64-65 (make_env env_type)
pointcloud:
  crop_box: [[0.10, -0.50, -0.02], [0.75, 0.50, 0.60]]   # cortexbench:lewm_pcd/envs/ogb_puzzle_env.py:61 (CROP_BOX)
policy: dqc
wm_data:
  recipe: ogbench_noisy       # Puzzle follows OGBench's noisy recipe and official scale
  num_episodes: 1000
  episode_len: 1001
  mixture: null
  collector: ogb              # cortexbench:lewm_pcd/scripts/data/collect_ogb.py + run_puzzle_collection.sh
  env_id: swm/OGBenchPuzzle3x3-v0   # run_puzzle_pipeline.sh:82 (ENV_ID); scripts/data/config/ogb_puzzle_pcd.yaml:14
  world: {num_envs: 1, max_episode_steps: 1001, image_shape: [224, 224]}   # ogb_puzzle_pcd.yaml:18-21
  env_kwargs: {}
  pcd: {_target_: jepa4r.envs.ogbench.ogb_pcd.PuzzlePointCloudWrapper}        # ogb_puzzle_pcd.yaml:25-26
  policy: {_target_: jepa4r.envs.ogbench.ogb_puzzle_env.PuzzleNoisyPolicy}    # ogb_puzzle_pcd.yaml:28-29
  health_check: false         # ogb_puzzle_pcd.yaml:35
  sets:                       # episode i at seed seed_base + i, shard s collects i = s, s + K, ...
    # run_puzzle_collection.sh:19 (defaults)
    - {name: puzzle_3x3_noisy1000, num_episodes: 1000, shards: 8, seed_base: 1000000}
    - {name: puzzle_3x3_noisy_test, num_episodes: 20, shards: 2, seed_base: 2000000}   # run_puzzle_collection.sh:19,38
  files: {pointcloud: puzzle_3x3_noisy1000_pcd.h5, image: puzzle_3x3_noisy1000.h5}
  split: random_clips
  max_parallel: 10            # run_puzzle_collection.sh:37-39 (both sets' shards at once)
  threads: 1                  # run_puzzle_collection.sh:27 (OMP_NUM_THREADS=1)
policy_data:
  source: official_play       # OGBench's official play data (supp. sec:supp-policy)
  dataset: puzzle-3x3-play-v0   # + its -val split; cortexbench:lewm_pcd/scripts/run_puzzle_baselines.sh:93,
                                # bench/dqc/README.md:9,40
