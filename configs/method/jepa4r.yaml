# JEPA4R: LeWM recipe on single-depth-camera point clouds through a parameter-matched PointNet.
_base_: _jepa_wm
name: jepa4r
display: JEPA4R (Ours)
obs: pointcloud
encoder: pointnet             # configs/encoder/pointnet.yaml
per_env:                      # the OGBench Cube 1-4 world models train in the Cube workflow, with seed 0
  "cube_single": &cube_workflow {train: {seed: 0}}
  "cube_double": *cube_workflow
  "cube_triple": *cube_workflow
  "cube_quadruple": *cube_workflow
