# PLDM [sobal2025pldm]: trained by us on the paired images for 10 epochs with its own recipe
# (supp. sec:supp-baselines).
name: pldm
display: PLDM
kind: pldm
impl: jepa4r.baselines.pldm
obs: image
encoder: vit_tiny14
per_env:
  "cube_*": {encoder: impala}   # on Cube, PLDM uses an Impala encoder. Cube 1-4 train in the Cube workflow
                                # (jepa4r/baselines/cube/pldm) with the PLDM authors' recipe, not the one below: Adam
                                # lr 7e-4, weight decay 1e-6, cosine schedule with 10% warm-up, 16 frames / 15 actions
                                # at 65 x 65, VICReg + IDM; batch 128, bf16, 10 epochs, seed 0
train:
  epochs: 10
  recipe:                     # PLDM's own hyper-parameters: stable-worldmodel's training, unchanged apart from the
                              # patch in third_party/stable-worldmodel/UPSTREAM.md (scripts/train/pldm.py + config
                              # pldm.yaml: ViT-tiny/14, 6-layer predictor, std / cov / temporal-alignment terms, AdamW
                              # 5e-5, weight decay 1e-3, batch 128, bf16, 0.9 / 0.1 split of seed 3072), started with
                              # these overrides + the env's image dataset + trainer.max_epochs = epochs
    overrides: [data=ogb, "~data.dataset.keys_to_merge"]
