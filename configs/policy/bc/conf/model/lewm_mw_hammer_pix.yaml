# LeWM 2D encoder (ViT-tiny + projector, the latent the predictor and planner use) trained on the full MetaWorld
# hammer three-part data (LeWM's mw_hammer data; run mw_hammer_pix, epoch 10). See
# jepa4r/policy/bc/lewm_cortex.py
_target_: lewm_cortex.load_lewm
checkpoint_dir: ${oc.env:STABLEWM_HOME}/checkpoints/mw_hammer_pix
epoch: 10
use_projector: true
random_init: false
