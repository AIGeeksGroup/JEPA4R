# Paper numbers: Tab. 2 (tab:metaworld / tab:adroit), CortexBench success (%), best of 20 evaluations.
# `values` are our runs; `published` rows are copied from other papers and only shown for reference.
tables:
  - name: tab2_cortexbench
    title: "Tab. 2 -- CortexBench, success (%) of policies on frozen latents"
    stage: train_policy
    rows: method
    cols: env
    metric: success
    col_order: [mw_assembly, mw_bin_pick, mw_button, mw_drawer, mw_hammer, mw_mean, adroit_relocate]
    derived:
      mw_mean: {mean_of: [mw_assembly, mw_bin_pick, mw_button, mw_drawer, mw_hammer]}
    labels:
      mw_mean: Mean
      pldm: PLDM (ViT-Tiny)
      lejepa: LeJEPA (ViT-Tiny)
      visreg: VISReg (ViT-B)
      vjepa21: V-JEPA 2.1 (ViT-B)
      lewm: LeWM (ViT-Tiny)
    values:
