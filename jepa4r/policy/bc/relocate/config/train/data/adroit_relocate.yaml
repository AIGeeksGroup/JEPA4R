# Moved from OGBench-cube@4fbb0c6:lewm_pcd/config/train/data/adroit_relocate.yaml (verbatim except: hydra targets of the moved LeWM classes (jepa4r.models.world_model.LEGACY_TARGETS))
dataset:
  name: ${oc.env:RELOCATE_RGB_TRAIN}
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 5
  keys_to_load:
    - pixels
    - action
    - observation
  keys_to_cache:
    - action
    - observation

preprocessor:
  _target_: jepa4r.data.clips.get_img_preprocessor
  source: pixels
  target: pixels
  img_size: ${img_size}
