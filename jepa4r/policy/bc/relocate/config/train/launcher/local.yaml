# @package _global_
# Moved from OGBench-cube@4fbb0c6:lewm_pcd/config/train/launcher/local.yaml (verbatim); the @package directive stays first: Hydra reads only the leading # @ lines
# Local launcher configuration (no SLURM)

defaults:
  - override /hydra/launcher: basic

wandb:
  enabled: False
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False
hydra:
  job:
    chdir: true   # Lightning's default CSV logger writes lightning_logs/ into cwd -> keep it inside the run dir on the data disk
  run:
    dir: ${oc.env:STABLEWM_HOME}/logs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}_${output_model_name}
  sweep:
    dir: ${oc.env:STABLEWM_HOME}/logs/train/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
