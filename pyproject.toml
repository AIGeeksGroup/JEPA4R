[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa4r"
version = "0.1.0"
description = "Action-conditioned JEPA world model for point-cloud dynamics"
requires-python = ">=3.11,<3.12"
# 版本锁定与 CUDA 索引见 requirements.txt / requirements-cu128.txt（CUDA 版 torch 轮子不在 PyPI 上，
# 请用 `make install` 或先 `pip install -r requirements.txt` 再 `pip install -e . --no-deps`）。
dependencies = [
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "spconv-cu120==2.3.6",
    "timm==1.0.29",
    "addict==2.4.0",
    "einops==0.8.2",
    "omegaconf==2.3.1",
    "numpy==1.26.4",
    "pytest==8.3.5",
]

[tool.setuptools]
packages = ["models", "losses", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
