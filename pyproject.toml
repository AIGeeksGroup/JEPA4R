[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa4r"
version = "0.1.0"
description = "JEPA4R: Embodied JEPA World Models with 4D Point Planning"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
# PyTorch 2.8 as in the paper. Simulator and policy-learning dependencies are added with the integrated code.
dependencies = ["torch>=2.8,<2.9", "numpy", "PyYAML>=6", "omegaconf>=2.3"]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.11", "pip-audit>=2.9"]
# The training stack of the paper runs (versions: GATES.md G1, conda env lewm_pcd); stable-worldmodel is vendored
# (pip install -e third_party/stable-worldmodel). The collection, CortexBench and DQC stacks: README.md (Installation).
train = ["torchvision==0.23.0", "numpy==1.24.4", "mujoco==3.12.0", "gymnasium==0.29.1", "timm==1.0.29",
         "transformers==4.50.3", "lightning==2.5.6", "stable-pretraining==0.1.8", "hydra-core", "einops", "h5py",
         "tensorboard", "matplotlib"]

# The OGBench-cube workflows' stacks, one environment each, with the versions their branch pins (torch / torchvision are
# the CUDA 12.8 wheels: pip install -e ".[<extra>]" --extra-index-url https://download.pytorch.org/whl/cu128):
# cube-worldmodel  Cube 1-4 collection and world models (JEPA4R_PY_CUBE_WM)
# cube-policy      Cube 1-4 encoding, GCIQL and the native evaluation (JEPA4R_PY_CUBE_RL)
# relocate-wm      Relocate / RH56 world models (JEPA4R_PY_RELOCATE_WM); stable-worldmodel from its recorded commit
# relocate-adroit  overlay on a CortexBench environment sharing relocate-wm's torch (JEPA4R_PY_ADROIT_SIM); mujoco-py,
#                  mjrl, mj_envs, dmc2gym and eai-vc from their pinned sources
#                  (configs/policy/bc/relocate/DEPENDENCIES.json)
# relocate-rh56    the RM75-B / RH56 simulator and BC overlay (JEPA4R_PY_RH56_SIM)
cube-worldmodel = ["torch==2.8.0+cu128", "torchvision==0.23.0+cu128", "numpy==2.2.6", "h5py==3.16.0",
                   "hdf5plugin==7.1.0", "hydra-core==1.3.6", "omegaconf==2.3.1", "hydra-submitit-launcher==1.2.0",
                   "stable-pretraining==0.1.8", "lightning==2.6.6", "transformers==5.17.0", "datasets==5.0.1",
                   "mujoco==3.3.7", "ogbench==1.2.1", "dm-control==1.0.34", "dm-env==1.6", "dm-tree==0.1.10",
                   "labmaze==1.0.6", "gymnasium==1.2.1", "einops==0.8.2", "wandb==0.22.2", "timm==1.0.29",
                   "PyYAML==6.0.3", "pytest==8.4.2", "opencv-python-headless==5.0.0.93", "pymunk==6.11.1",
                   "pygame==2.6.1", "shapely==2.1.2", "imageio==2.38.0", "imageio-ffmpeg==0.6.0", "psutil==7.2.2",
                   "rich==15.0.0", "tabulate==0.10.0", "protobuf==6.33.6"]
cube-policy = ["torch==2.8.0+cu128", "torchvision==0.23.0+cu128", "numpy==2.2.6", "h5py==3.16.0", "hdf5plugin==7.1.0",
               "hydra-core==1.3.6", "omegaconf==2.3.1", "hydra-submitit-launcher==1.2.0", "stable-pretraining==0.1.8",
               "lightning==2.6.6", "transformers==5.17.0", "datasets==5.0.1", "mujoco==3.3.7", "ogbench==1.2.1",
               "dm-control==1.0.34", "dm-env==1.6", "dm-tree==0.1.10", "labmaze==1.0.6", "gymnasium==1.2.1",
               "einops==0.8.2", "wandb==0.22.2", "timm==1.0.29", "PyYAML==6.0.3", "pytest==8.4.2",
               "opencv-python-headless==5.0.0.93", "pymunk==6.11.1", "pygame==2.6.1", "shapely==2.1.2",
               "imageio==2.38.1", "imageio-ffmpeg==0.6.0", "psutil==7.2.2", "rich==15.0.0", "tabulate==0.10.0",
               "jax[cuda12]==0.7.2", "flax==0.11.2", "optax==0.2.5", "distrax==0.1.7", "ml_collections==1.1.0",
               "orbax-checkpoint==0.12.7", "tfp-nightly==0.26.0.dev20261016", "protobuf==6.33.6"]
relocate-wm = ["torch==2.8.0+cu128", "torchvision==0.23.0+cu128", "numpy==1.26.4", "transformers==5.17.0",
               "stable-pretraining==0.1.8", "lightning==2.6.6", "hydra-core==1.3.6", "omegaconf==2.3.1",
               "h5py==3.16.0", "scikit-learn==1.7.2", "einops==0.8.2", "timm==1.0.29", "gymnasium==1.2.1",
               "Pillow==12.3.0"]
relocate-adroit = ["numpy==1.23.5", "timm==0.6.11", "gym==0.23.1", "Cython==0.29.37", "fasteners==0.20",
                   "transforms3d==0.4.2", "termcolor==2.4.0", "dill==0.3.8"]
relocate-rh56 = ["numpy==1.26.4", "mujoco==3.12.0", "timm==0.6.11", "gym==0.23.1", "Cython==0.29.37",
                 "fasteners==0.20", "transforms3d==0.4.2", "termcolor==2.4.0", "dill==0.3.8"]

[project.scripts]
jepa4r-run = "jepa4r.cli:run_main"
jepa4r-reproduce = "jepa4r.orchestrate:main"
jepa4r-report = "jepa4r.report:main"

[tool.setuptools.packages.find]
include = ["jepa4r*"]

[tool.setuptools.package-data]
"jepa4r.envs.twins" = ["descriptions/**/*"]      # RM75-B + EG2-4C2 MJCF and meshes

[tool.ruff]
target-version = "py310"
line-length = 120
# vendored upstream code, unchanged apart from the changes in third_party/*/UPSTREAM.md
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E9", "F"]
