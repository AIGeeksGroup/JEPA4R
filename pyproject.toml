[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa4r"
version = "0.1.0"
description = "JEPA4R: Embodied JEPA World Models with 4D Point Planning"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
# PyTorch 2.8 as in the paper. Simulator and policy-learning dependencies are added with the integrated code.
dependencies = ["torch>=2.8,<2.9", "numpy", "PyYAML>=6", "omegaconf>=2.3"]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.11", "pip-audit>=2.9"]
# The training stack of the paper runs (versions: GATES.md G1, conda env lewm_pcd); stable-worldmodel is vendored
# (pip install -e third_party/stable-worldmodel). The collection, CortexBench and DQC stacks: README.md (Installation);
# the OGBench-cube workflows' stacks: jepa4r/policy/gciql/requirements/, jepa4r/policy/bc/relocate/requirements/.
train = ["torchvision==0.23.0", "numpy==1.24.4", "mujoco==3.12.0", "gymnasium==0.29.1", "timm==1.0.29",
         "transformers==4.50.3", "lightning==2.5.6", "stable-pretraining==0.1.8", "hydra-core", "einops", "h5py",
         "tensorboard", "matplotlib"]

[project.scripts]
jepa4r-run = "jepa4r.cli:run_main"
jepa4r-reproduce = "jepa4r.orchestrate:main"
jepa4r-report = "jepa4r.report:main"

[tool.setuptools.packages.find]
include = ["jepa4r*"]

[tool.setuptools.package-data]
"jepa4r.envs.twins" = ["descriptions/**/*"]      # RM75-B + EG2-4C2 MJCF and meshes
"jepa4r.policy.bc" = ["conf/model/*.yaml"]       # the CortexBench embedding configs of the paper runs

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["third_party"]   # vendored upstream code, unchanged apart from the changes in third_party/*/UPSTREAM.md

[tool.ruff.lint]
select = ["E9", "F"]
